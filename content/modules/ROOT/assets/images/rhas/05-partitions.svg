<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="400" viewBox="0 0 1170 400" role="img" aria-label="Demo applications in the partitions of a RHIVOS image">
<title>Demo applications in the partitions of a RHIVOS image</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A6E73"/></marker></defs>
<rect width="1170" height="400" fill="#FFFFFF"/>
<rect x="10" y="10" width="1150" height="380" rx="10" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="30" y="36" font-family="'Red Hat Display','Red Hat Text','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#151515">RHIVOS image</text>
<rect x="30" y="52" width="380" height="226" rx="8" fill="#F2F2F2" stroke="#8A8D90" stroke-width="2"/>
<text x="220" y="78" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#151515">Root partition (ASIL)</text>
<text x="220" y="97" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">safety-relevant</text>
<rect x="430" y="52" width="720" height="226" rx="8" fill="#F2F2F2" stroke="#8A8D90" stroke-width="2" stroke-dasharray="8 5"/>
<text x="790" y="78" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#151515">QM partition (container)</text>
<text x="790" y="97" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">quality-managed, isolated from the root partition, memory limit: 20%</text>
<rect x="50" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="2"/>
<text x="130" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">engine-service</text>
<text x="130" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">ipc_t</text>
<rect x="230" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="310" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">ffi_server</text>
<text x="310" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">ipc_t</text>
<rect x="450" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="530" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">radio-service</text>
<text x="530" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="625" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="705" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">routingmanagerd</text>
<text x="705" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="800" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="880" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">dlt-daemon</text>
<text x="880" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="975" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2"/>
<text x="1055" y="146" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#151515">ffi_client</text>
<text x="1055" y="166" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_container_ipc_t</text>
<rect x="800" y="200" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#8A8D90" stroke-width="2" stroke-dasharray="4 4"/>
<text x="880" y="223" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#151515">other QM processes</text>
<text x="880" y="242" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="11" fill="#6A6E73">qm_t: no socket access</text>
<rect x="50" y="314" width="1085" height="48" rx="8" fill="#E7F1FA" stroke="#0066CC" stroke-width="2"/>
<text x="592.5" y="335" text-anchor="middle" font-family="'Red Hat Mono',Menlo,monospace" font-size="13" font-weight="500" fill="#151515">/run/ipc</text>
<text x="592.5" y="353" text-anchor="middle" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#151515">shared communication sockets: vsomeip/ for SOME/IP, ffi_server.socket for the memory reports</text>
<line x1="130" y1="182" x2="130" y2="310" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="310" y1="182" x2="310" y2="310" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="530" y1="182" x2="530" y2="310" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="705" y1="182" x2="705" y2="310" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="1055" y1="182" x2="1055" y2="310" stroke="#6A6E73" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="140" y="258" text-anchor="start" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">sends gear state</text>
<text x="300" y="232" text-anchor="end" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">memory reports</text>
<text x="540" y="258" text-anchor="start" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">receives gear state</text>
<text x="1045" y="300" text-anchor="end" font-family="'Red Hat Text','Red Hat Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6A6E73">memory reports</text>
</svg>
